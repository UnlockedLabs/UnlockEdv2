apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # frontend-config is subPath-mounted, which Kubernetes never updates
        # in place on a running pod — without this, a ConfigMap-only change
        # (e.g. helm upgrade --set frontendConfig.posthogKey=...) updates the
        # object but the Deployment spec is unchanged, so nothing rolls out
        # and the old config.js keeps being served indefinitely.
        checksum/frontend-config: {{ include (print $.Template.BasePath "/frontend-config.yml") . | sha256sum }}
    spec:
      containers:
        - args: ["-g daemon off;"]
          image:                    # OCI container image registry location
          name: frontend
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: config
              subPath: nginx.conf
            - mountPath: /usr/share/nginx/html/config.js
              name: frontend-config
              subPath: config.js
            - mountPath: /var/log/nginx/
              name: logs
      restartPolicy: Always
      imagePullSecrets:
        - name: ecr-secret
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: logs
        - name: config
          configMap:
            name: nginx-config
        - name: frontend-config
          configMap:
            name: frontend-config
