apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
   server {
       listen       80;
       server_name  example.com;
       gzip on;

       # Runtime config (EN-176) must never be served stale — nginx sets no
       # cache headers anywhere else here, so without this a browser's
       # heuristic caching could still hold onto an old site name/PostHog key
       # for hours after the ConfigMap changes, defeating the point of it.
       location = /config.js {
           add_header Cache-Control "no-store";
       }

       location / {
           root   /usr/share/nginx/html;
           index  index.html index.htm;
           try_files $uri $uri/ /index.html;
       }
   }
