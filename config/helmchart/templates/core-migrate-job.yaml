apiVersion: batch/v1
kind: Job
metadata:
  name: core-migrate
  labels:
    app: core-migrate
  annotations:
    # Runs before the server Deployment and blocks it until this succeeds, so
    # the server never serves against an unmigrated/partially-migrated schema
    # (InitDB no longer migrates on startup -- EN-177). Safe as a hook here,
    # unlike the new unlocked-platform chart: server-dsn is a plain Secret a
    # site provisions by hand before `helm install`, not an ESO ExternalSecret
    # synced after install starts, so there's no secret-not-ready race.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      containers:
        - name: core-migrate
          image:             # same OCI image as the server Deployment
          command: ["/migrate", "-dir", "/migrations"]
          env:
            - name: APP_ENV
              value: production
            - name: APP_DSN
              valueFrom:
                secretKeyRef:
                  name: server-dsn
                  key: SERVER_DSN  # same secret the server Deployment uses
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ecr-secret  # ecr-secret needs to be created if pulling images from AWS ecr
  backoffLimit: 4
# Stopgap for sites still on this chart (EN-177). Retired once a site cuts
# over to unlocked-platform (EN-180), which uses per-revision Jobs instead of
# hooks (that chart's secrets ARE ESO-managed, so a pre-install hook there
# would race ExternalSecrets -- not a concern for this chart, see above).
