name: Container ECR build + deploy
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  setup-env:
    if: github.repository == 'UnlockedLabs/UnlockEdv2' || github.repository == 'PThorpe92/UnlockEdv2'
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check-changes.outputs.changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - id: check-changes
        run: |
          paths=("frontend/" "backend/" "provider-middleware/")
          changes=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Release tags have no meaningful "before" commit to diff against —
            # build and tag every image.
            for path in "${paths[@]}"; do
              changes+="${path}:1,"
            done
          else
            BASE="${{ github.event.before }}"
            echo "$BASE"
            git fetch origin "$BASE"
            for path in "${paths[@]}"; do
              count=$(git diff --name-only HEAD.."$BASE" | grep "^${path}" | wc -l)
              changes+="${path}:${count},"
            done
          fi
          changes="${changes%,}"
          echo "changes=${changes}" >> $GITHUB_OUTPUT

      - name: Check duplicate migration files
        run: |
          DUPLICATE_MIGRATIONS=$(ls -1 backend/migrations | grep '.*\.sql' | cut -c1-5 | sort | uniq -d)
          if [ -z "$DUPLICATE_MIGRATIONS" ]; then
            echo "no invalid migrations found"
          else
            echo "🚨 Duplicate migration files found 🚨"
            echo "Migration number: $DUPLICATE_MIGRATIONS is a duplicate\n and needs to be renamed"
            exit 1
          fi

  build-and-push:
    if: github.repository == 'UnlockedLabs/UnlockEdv2' || github.repository == 'PThorpe92/UnlockEdv2'
    needs: setup-env
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.build-images.outputs.deployments }}
    env:
      CHANGES: ${{ needs.setup-env.outputs.changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Version
        run: |
          # main also gets :latest so the existing staging restart flow keeps working.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "IMAGE_VERSION=${TAG#v}" >> $GITHUB_ENV
            echo "EXTRA_TAG=" >> $GITHUB_ENV
          else
            echo "IMAGE_VERSION=sha-${GITHUB_SHA:0:7}" >> $GITHUB_ENV
            echo "EXTRA_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - id: build-images
        run: |
          echo "CHANGES: $CHANGES"
          deployments=()
          IFS=',' read -ra entries <<< "$CHANGES"
          for entry in "${entries[@]}"; do
            if [ -z "$entry" ]; then
              continue
            fi
            path=$(echo "$entry" | cut -d':' -f1)
            count=$(echo "$entry" | cut -d':' -f2)
            if [[ $count -ne 0 ]]; then
              case $path in
                "frontend/")
                  echo "Building frontend image"
                  # Site name and PostHog key are read at runtime from each
                  # deployment's /config.js (EN-176) instead of baked in here —
                  # one image now works on every site.
                  TAGS=(-t "${{ steps.login-ecr.outputs.registry }}/frontend:${IMAGE_VERSION}")
                  [[ -n "$EXTRA_TAG" ]] && TAGS+=(-t "${{ steps.login-ecr.outputs.registry }}/frontend:${EXTRA_TAG}")
                  docker buildx build --platform linux/amd64 "${TAGS[@]}" --push frontend/.
                  deployments+=("frontend")
                  ;;
                "backend/")
                  echo "Building backend image"
                  TAGS=(-t "${{ steps.login-ecr.outputs.registry }}/unlockedv2:${IMAGE_VERSION}")
                  [[ -n "$EXTRA_TAG" ]] && TAGS+=(-t "${{ steps.login-ecr.outputs.registry }}/unlockedv2:${EXTRA_TAG}")
                  docker buildx build --platform linux/amd64 "${TAGS[@]}" --push -f backend/Dockerfile .
                  deployments+=("server")
                  ;;
                "provider-middleware/")
                  echo "Building middleware image"
                  TAGS=(-t "${{ steps.login-ecr.outputs.registry }}/provider_middleware:${IMAGE_VERSION}")
                  [[ -n "$EXTRA_TAG" ]] && TAGS+=(-t "${{ steps.login-ecr.outputs.registry }}/provider_middleware:${EXTRA_TAG}")
                  docker buildx build --platform linux/amd64 "${TAGS[@]}" --push -f provider-middleware/Dockerfile .
                  deployments+=("provider-service")
                  ;;
              esac
            fi
          done
          echo "deployments=${deployments[*]}" >> $GITHUB_OUTPUT

  restart-deployments:
    if: github.repository == 'UnlockedLabs/UnlockEdv2' || github.repository == 'PThorpe92/UnlockEdv2'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Restart Deployments via SSM
        env:
          SSM_TARGET_INSTANCE_ID: ${{ secrets.SSM_TARGET_INSTANCE_ID }}
        run: |
          deployments="${{ needs.build-and-push.outputs.deployments }}"
          if [[ -z "$deployments" ]]; then
            echo "No deployments need restarting."
            exit 0
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            NAMESPACE="staging"
          else
            echo "Skipping deployment restarts for ${GITHUB_REF}"
            exit 0
          fi
          # this command runs the rollout.sh executable file
          COMMAND="rollout.sh $NAMESPACE $deployments"
          PARAMETERS=$(jq -n --arg cmd "$COMMAND" '{"commands": [$cmd]}')
          aws ssm send-command \
            --instance-ids "$SSM_TARGET_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Restarting deployments in $NAMESPACE"
