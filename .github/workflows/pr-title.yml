name: PR title

# Squash and merge lands a multi-commit PR on main under its title, so the
# title must be a conventional commit too (commit.yml checks the commits).
# Same check as unlocked-hiset-ai (EN-214). When release-please is added here
# (EN-181), run it with the release bot's app token, as unlocked-hiset-ai
# does, so its release PRs start this check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: pr title
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert|style)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a conventional commit: $TITLE"
            exit 1
          fi
